# Somente o banco para desenvolvimento local: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lp
      POSTGRES_PASSWORD: lp
      POSTGRES_DB: lp
    # Só nesta máquina (127.0.0.1): a senha "lp" é de desenvolvimento e não pode ficar exposta na rede
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
volumes:
  pgdata-dev:
