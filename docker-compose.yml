# Produção em VPS: docker compose up -d
# Pré-requisitos: DNS do domínio do sistema apontando para a VPS e o arquivo .env preenchido
# com POSTGRES_PASSWORD e JWT_SECRET (obrigatórios; sem eles o compose/a API não sobem).
#
# Instalação que já roda com a senha antiga padrão "lp": defina POSTGRES_PASSWORD=lp no .env para
# subir sem perder a conexão e troque a senha depois (passo a passo em SECURITY.md). O Postgres só
# aplica POSTGRES_PASSWORD ao criar o volume: mudar a variável não troca a senha de um banco existente.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (senha do banco)}
      POSTGRES_DB: lp
    # Sem "ports": o banco só é acessível pela rede interna do compose (serviço app), nunca pela internet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lp:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (senha do banco)}@db:5432/lp
      DATABASE_SSL: "false"
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Proxy HTTPS: certificado automático para o domínio do sistema e,
  # sob demanda, para cada domínio personalizado de Landing Page.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
